# The static checks do not need the OSA deployment test harness. Keep their
# dependencies local so retired OpenStack branches cannot break every job.
[tox]
minversion = 4.0
envlist = pep8,bashate,bandit,docs,releasenotes,ansible-syntax,ansible-lint,bond-detection
skipsdist = true

[testenv]
package = skip
deps = -r{toxinidir}/test-requirements-ci.txt
setenv =
    ANSIBLE_LOCAL_TEMP = {envtmpdir}/ansible
    ANSIBLE_LIBRARY = {toxinidir}/playbooks/library
allowlist_externals = bash

[testenv:pep8]
commands = bash -o pipefail -c "git grep -Il '^.!.*python$' -- ':!doc' | xargs flake8 --verbose"

[testenv:bashate]
commands = bash -o pipefail -c "git grep -Il '^.!.*\(ba\)\?sh$' | xargs bashate --error . --verbose --ignore=E003,E006,E040"

[testenv:bandit]
commands =
    - bandit -s B404,B410,B501 -i -l -r playbooks/
    bandit -s B404,B410,B501 -iii -lll -r playbooks/

[testenv:docs]
commands =
    doc8 doc
    sphinx-build -a -E -W -b html doc/source doc/build/html

[testenv:releasenotes]
commands = sphinx-build -a -E -W -b html releasenotes/source releasenotes/build/html

[testenv:ansible-syntax]
commands =
    ansible-galaxy collection install -r ansible-collection-requirements.yml
    ansible-playbook -i localhost, --syntax-check --list-tasks tests/test.yml
    {[testenv:bond-detection]commands}

[testenv:ansible-lint]
commands =
    ansible-galaxy collection install -r ansible-collection-requirements.yml
    ansible-lint -w 208 -w 306 -w 502 -w 503 -w var-naming -w role-name -w metadata tests/test.yml

[testenv:bond-detection]
commands = python -m unittest discover -s tests -p test_bond_detection.py -v
