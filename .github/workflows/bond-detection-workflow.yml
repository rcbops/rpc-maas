name: bond-detection-workflow
on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: bond-detection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bond-detection:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Test bond detection with Ansible
        run: ./gating/github_action_scripts/linting_run.sh
        env:
          RE_JOB_SCENARIO: bond-detection
